name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use version from package.json)'
        required: false
        type: string
      tag:
        description: 'npm dist-tag (e.g., latest, next, beta)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set release version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./_packages/native-preview/package.json').version")
          fi
          echo "Publishing version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s|const nativePreviewReleaseVersion = .*|const nativePreviewReleaseVersion = \"$VERSION\";|" Herebyfile.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build platform packages
        run: npx hereby native-preview:build-packages

      - name: Pack tarballs
        run: npx hereby native-preview:pack-packages

      - name: Publish to npm
        run: |
          MANIFEST="built/npm/publish-manifest.json"
          TAG="${{ inputs.tag || 'latest' }}"

          echo "Publishing with tag: $TAG"

          # Stage 1: platform-specific packages first
          for entry in $(jq -r '.stages[0][] | .filename' "$MANIFEST"); do
            echo "Publishing platform package: $entry"
            npm publish "built/npm/$entry" --access public --tag "$TAG"
          done

          # Stage 2: main package (depends on platform packages)
          for entry in $(jq -r '.stages[1][] | .filename' "$MANIFEST"); do
            echo "Publishing main package: $entry"
            npm publish "built/npm/$entry" --access public --tag "$TAG"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
